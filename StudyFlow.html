<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- TIME UTILITIES ---
    function formatSecondsToHMS(totalSeconds) {
      if (!totalSeconds || isNaN(totalSeconds) || totalSeconds < 0) totalSeconds = 0;
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = Math.floor(totalSeconds % 60);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function formatSecondsHuman(totalSeconds) {
      if (!totalSeconds || isNaN(totalSeconds) || totalSeconds < 0) return '0m';
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = Math.floor(totalSeconds % 60);
      if (hours > 0) return minutes > 0 ? `${hours}h ${minutes}m` : `${hours}h`;
      if (minutes > 0) return `${minutes}m`;
      return `${seconds}s`;
    }

    function getLocalDateString(dateInput = new Date()) {
      const d = new Date(dateInput);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatTime12H(dateInput) {
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return '--:--';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function formatFriendlyDate(dateStr) {
      const todayStr = getLocalDateString(new Date());
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = getLocalDateString(yesterday);
      if (dateStr === todayStr) return 'Today';
      if (dateStr === yesterdayStr) return 'Yesterday';
      const [y, m, d] = dateStr.split('-');
      const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
      return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Midnight crossing splitter
    function distributeSessionAcrossMidnight(startTimestamp, endTimestamp, actualStudySeconds, subjectId, note = '') {
      if (actualStudySeconds <= 0) return [];
      const startDate = new Date(startTimestamp);
      const endDate = new Date(endTimestamp);
      const startDateStr = getLocalDateString(startDate);
      const endDateStr = getLocalDateString(endDate);

      if (startDateStr === endDateStr) {
        return [{
          id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
          subjectId,
          date: startDateStr,
          startTime: startDate.toISOString(),
          endTime: endDate.toISOString(),
          durationSeconds: Math.round(actualStudySeconds),
          note: note.trim()
        }];
      }

      const totalElapsedMs = Math.max(1000, endTimestamp - startTimestamp);
      const sessions = [];
      let currentStart = new Date(startTimestamp);

      while (currentStart < endDate) {
        const curDateStr = getLocalDateString(currentStart);
        const nextMidnight = new Date(currentStart.getFullYear(), currentStart.getMonth(), currentStart.getDate() + 1, 0, 0, 0, 0);
        const segmentEnd = nextMidnight < endDate ? nextMidnight : endDate;
        const segmentMs = segmentEnd.getTime() - currentStart.getTime();
        const segmentProportion = segmentMs / totalElapsedMs;
        const segmentStudySeconds = Math.round(actualStudySeconds * segmentProportion);

        if (segmentStudySeconds > 0) {
          sessions.push({
            id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7) + '_' + sessions.length,
            subjectId,
            date: curDateStr,
            startTime: currentStart.toISOString(),
            endTime: segmentEnd.toISOString(),
            durationSeconds: segmentStudySeconds,
            note: note.trim() ? `${note.trim()} (Midnight split)` : 'Midnight split session'
          });
        }
        currentStart = nextMidnight;
      }
      return sessions;
    }

    function calculateStreak(sessions = []) {
      if (!sessions || sessions.length === 0) return 0;
      const activeDates = new Set();
      sessions.forEach(s => {
        if (s.durationSeconds > 0 && s.date) activeDates.add(s.date);
      });
      if (activeDates.size === 0) return 0;

      const todayStr = getLocalDateString(new Date());
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = getLocalDateString(yesterday);

      let checkDate = new Date();
      if (!activeDates.has(todayStr)) {
        if (!activeDates.has(yesterdayStr)) return 0;
        checkDate.setDate(checkDate.getDate() - 1);
      }

      let streak = 0;
      while (true) {
        const dStr = getLocalDateString(checkDate);
        if (activeDates.has(dStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    // --- WEB AUDIO SYNTHESIZER ---
    class SoundPlayer {
      constructor() { this.ctx = null; this.muted = false; }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      setMuted(m) { this.muted = m; }
      playStart() {
        if (this.muted) return;
        try {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.4);
        } catch (e) {}
      }
      playPause() {
        if (this.muted) return;
        try {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(349.23, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        } catch (e) {}
      }
      playComplete() {
        if (this.muted) return;
        try {
          this.init(); if (!this.ctx) return;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime + idx * 0.12;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.45);
          });
        } catch (e) {}
      }
      playBell() {
        if (this.muted) return;
        try {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 1.2);
        } catch (e) {}
      }
    }
    const sound = new SoundPlayer();

    // --- STORAGE MANAGER ---
    const STORAGE_KEYS = {
      SUBJECTS: 'studyflow_subjects',
      SESSIONS: 'studyflow_sessions',
      GOALS: 'studyflow_goals',
      SETTINGS: 'studyflow_settings',
      ACTIVE_TIMER: 'studyflow_active_timer'
    };

    const DEFAULT_SUBJECTS = [
      { id: 'subj_math', name: 'Mathematics', color: '#3B82F6', dailyGoalMinutes: 60, weeklyGoalMinutes: 300, order: 0 },
      { id: 'subj_dbms', name: 'DBMS', color: '#8B5CF6', dailyGoalMinutes: 45, weeklyGoalMinutes: 225, order: 1 },
      { id: 'subj_dsa', name: 'DSA', color: '#10B981', dailyGoalMinutes: 90, weeklyGoalMinutes: 450, order: 2 },
      { id: 'subj_python', name: 'Python', color: '#F59E0B', dailyGoalMinutes: 60, weeklyGoalMinutes: 300, order: 3 }
    ];

    const DEFAULT_GOALS = { overallDailyMinutes: 240 };
    const DEFAULT_SETTINGS = {
      darkMode: true,
      soundEnabled: true,
      pomodoro: { studyMinutes: 25, shortBreakMinutes: 5, longBreakMinutes: 15, longBreakInterval: 4 }
    };

    function safeGet(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (err) { return fallback; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (err) { return false; }
    }

    const Storage = {
      getSubjects() {
        const stored = safeGet(STORAGE_KEYS.SUBJECTS, null);
        if (!stored || !Array.isArray(stored) || stored.length === 0) {
          safeSet(STORAGE_KEYS.SUBJECTS, DEFAULT_SUBJECTS);
          return DEFAULT_SUBJECTS;
        }
        return stored.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      },
      saveSubjects(subjects) { return safeSet(STORAGE_KEYS.SUBJECTS, subjects); },
      getSessions() {
        const stored = safeGet(STORAGE_KEYS.SESSIONS, []);
        return Array.isArray(stored) ? stored : [];
      },
      saveSessions(sessions) { return safeSet(STORAGE_KEYS.SESSIONS, sessions); },
      addMultipleSessions(newSessions) {
        const current = this.getSessions();
        const updated = [...newSessions, ...current];
        this.saveSessions(updated);
        return updated;
      },
      updateSession(updatedSession) {
        const current = this.getSessions();
        const updated = current.map(s => s.id === updatedSession.id ? updatedSession : s);
        this.saveSessions(updated);
        return updated;
      },
      deleteSession(sessionId) {
        const current = this.getSessions();
        const updated = current.filter(s => s.id !== sessionId);
        this.saveSessions(updated);
        return updated;
      },
      getGoals() { return safeGet(STORAGE_KEYS.GOALS, DEFAULT_GOALS); },
      saveGoals(goals) { return safeSet(STORAGE_KEYS.GOALS, goals); },
      getSettings() { return { ...DEFAULT_SETTINGS, ...safeGet(STORAGE_KEYS.SETTINGS, {}) }; },
      saveSettings(settings) { return safeSet(STORAGE_KEYS.SETTINGS, settings); },
      getActiveTimer() { return safeGet(STORAGE_KEYS.ACTIVE_TIMER, null); },
      saveActiveTimer(t) { if (!t) localStorage.removeItem(STORAGE_KEYS.ACTIVE_TIMER); else safeSet(STORAGE_KEYS.ACTIVE_TIMER, t); },
      clearActiveTimer() { localStorage.removeItem(STORAGE_KEYS.ACTIVE_TIMER); },
      getAllData() {
        return {
          version: '1.0.0',
          exportedAt: new Date().toISOString(),
          subjects: this.getSubjects(),
          sessions: this.getSessions(),
          goals: this.getGoals(),
          settings: this.getSettings()
        };
      },
      clearAll() {
        Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
      }
    };

    // Export Helpers
    function triggerDownload(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    }

    function exportToJSON() {
      const data = Storage.getAllData();
      triggerDownload(JSON.stringify(data, null, 2), `studyflow-backup-${getLocalDateString()}.json`, 'application/json');
    }

    function exportToCSV(subjects = []) {
      const sessions = Storage.getSessions();
      const subjectMap = {};
      subjects.forEach(s => { subjectMap[s.id] = s.name; });
      const headers = ['Session ID', 'Date', 'Subject', 'Start Time', 'End Time', 'Duration (Seconds)', 'Duration (Formatted)', 'Notes'];
      const rows = sessions.map(sess => {
        const subjName = subjectMap[sess.subjectId] || 'Unassigned';
        const cleanNote = (sess.note || '').replace(/"/g, '""');
        const startFormatted = sess.startTime ? new Date(sess.startTime).toLocaleTimeString() : '';
        const endFormatted = sess.endTime ? new Date(sess.endTime).toLocaleTimeString() : '';
        const hms = formatSecondsToHMS(sess.durationSeconds || 0);
        return [`"${sess.id}"`, `"${sess.date || ''}"`, `"${subjName}"`, `"${startFormatted}"`, `"${endFormatted}"`, sess.durationSeconds || 0, `"${hms}"`, `"${cleanNote}"`].join(',');
      });
      triggerDownload([headers.join(','), ...rows].join('\r\n'), `studyflow-history-${getLocalDateString()}.csv`, 'text/csv;charset=utf-8;');
    }

    function validateAndImportJSON(jsonText) {
      try {
        const parsed = JSON.parse(jsonText);
        if (!parsed || typeof parsed !== 'object') return { success: false, message: 'Invalid JSON file.' };
        if (parsed.subjects && !Array.isArray(parsed.subjects)) return { success: false, message: 'Subjects must be a list.' };
        if (parsed.sessions && !Array.isArray(parsed.sessions)) return { success: false, message: 'Sessions must be a list.' };

        if (parsed.subjects) Storage.saveSubjects(parsed.subjects);
        if (parsed.sessions) Storage.saveSessions(parsed.sessions);
        if (parsed.goals) Storage.saveGoals(parsed.goals);
        if (parsed.settings) Storage.saveSettings(parsed.settings);
        return { success: true, message: `Imported ${(parsed.subjects || []).length} subjects and ${(parsed.sessions || []).length} sessions!` };
      } catch (err) {
        return { success: false, message: 'Parse error: ' + err.message };
      }
    }

    // --- REUSABLE MODAL & TOAST ---
    function ConfirmationModal({ isOpen, title, message, confirmText = 'Confirm', cancelText = 'Cancel', danger = false, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl animate-scaleUp">
            <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-3">{title}</h3>
            <p className="text-slate-600 dark:text-slate-300 text-sm mb-6 leading-relaxed">{message}</p>
            <div className="flex justify-end gap-3">
              <button onClick={onCancel} className="px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">
                {cancelText}
              </button>
              <button
                onClick={onConfirm}
                className={`px-5 py-2 text-sm font-bold rounded-xl text-white shadow-lg transition ${
                  danger ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'
                }`}
              >
                {confirmText}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Toast({ toast, onClose }) {
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => onClose(), 3500);
        return () => clearTimeout(timer);
      }, [toast, onClose]);
      if (!toast) return null;
      return (
        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-2xl shadow-2xl border bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 animate-slideIn">
          <span className="text-xl">{toast.type === 'success' ? '✅' : toast.type === 'error' ? '❌' : 'ℹ️'}</span>
          <p className="text-sm font-bold text-slate-800 dark:text-slate-100">{toast.message}</p>
          <button onClick={onClose} className="ml-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">✕</button>
        </div>
      );
    }

    // --- SIDEBAR ---
    function Sidebar({ activeTab, setActiveTab, isTimerRunning, darkMode, setDarkMode, isOpenMobile, setIsOpenMobile }) {
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
        { id: 'subjects', label: 'Subjects', icon: '📚' },
        { id: 'timer', label: 'Study Timer', icon: '⏱️', hasBadge: isTimerRunning },
        { id: 'analytics', label: 'Analytics', icon: '📈' },
        { id: 'history', label: 'History', icon: '🕒' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ];
      return (
        <>
          {isOpenMobile && (
            <div onClick={() => setIsOpenMobile(false)} className="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm lg:hidden" />
          )}
          <aside className={`fixed top-0 bottom-0 left-0 z-40 w-64 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-r border-slate-200/80 dark:border-slate-800/80 flex flex-col justify-between transition-transform duration-300 lg:translate-x-0 ${isOpenMobile ? 'translate-x-0' : '-translate-x-full'}`}>
            <div>
              <div className="flex items-center justify-between p-6 border-b border-slate-100 dark:border-slate-800/60">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <span className="text-xl font-black">✦</span>
                  </div>
                  <div>
                    <h1 className="text-lg font-black tracking-tight text-slate-900 dark:text-white">
                      Study<span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Flow</span>
                    </h1>
                    <p className="text-[11px] text-slate-400 font-medium">Smart Study Tracker</p>
                  </div>
                </div>
                <button onClick={() => setIsOpenMobile(false)} className="lg:hidden p-2 text-slate-400">✕</button>
              </div>

              <nav className="p-4 space-y-1.5">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setIsOpenMobile(false); }}
                    className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-semibold text-sm transition ${
                      activeTab === item.id
                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md shadow-indigo-500/20'
                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <span className="text-lg">{item.icon}</span>
                      <span>{item.label}</span>
                    </div>
                    {item.hasBadge && (
                      <span className="relative flex h-2.5 w-2.5">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-100 dark:border-slate-800/60 space-y-3">
              {isTimerRunning && (
                <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs flex items-center gap-2 font-bold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>Active study running</span>
                </div>
              )}
              <div className="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-100/70 dark:bg-slate-800/50">
                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">{darkMode ? 'Dark Theme' : 'Light Theme'}</span>
                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-1.5 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-sm"
                  title="Toggle theme"
                >
                  {darkMode ? '🌙' : '☀️'}
                </button>
              </div>
            </div>
          </aside>
        </>
      );
    }

    // --- DASHBOARD ---
    function Dashboard({ subjects, sessions, goals, onNavigateTab, onQuickStartSubject }) {
      const todayStr = getLocalDateString(new Date());
      const stats = useMemo(() => {
        let todaySec = 0, weekSec = 0, monthSec = 0, lifetimeSec = 0;
        const subjectTimeMap = {};
        const d7 = new Date(); d7.setDate(d7.getDate() - 6);
        const startWeekStr = getLocalDateString(d7);
        const d30 = new Date(); d30.setDate(d30.getDate() - 29);
        const startMonthStr = getLocalDateString(d30);

        sessions.forEach(sess => {
          const dur = sess.durationSeconds || 0;
          lifetimeSec += dur;
          if (sess.date === todayStr) todaySec += dur;
          if (sess.date >= startWeekStr && sess.date <= todayStr) weekSec += dur;
          if (sess.date >= startMonthStr && sess.date <= todayStr) monthSec += dur;
          const sId = sess.subjectId || 'unassigned';
          subjectTimeMap[sId] = (subjectTimeMap[sId] || 0) + dur;
        });
        return {
          todaySec, weekSec, monthSec, lifetimeSec, subjectTimeMap,
          streak: calculateStreak(sessions), totalSessions: sessions.length
        };
      }, [sessions, todayStr]);

      const dailyGoalMinutes = goals?.overallDailyMinutes || 240;

    // --- SUBJECT MANAGER ---
    const PRESET_COLORS = ['#3B82F6', '#8B5CF6', '#EC4899', '#EF4444', '#F59E0B', '#10B981', '#06B6D4', '#6366F1'];

    function SubjectManager({ subjects, sessions, onSaveSubject, onDeleteSubject, onReorderSubjects, onShowToast }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingSubject, setEditingSubject] = useState(null);
      const [name, setName] = useState('');
      const [color, setColor] = useState(PRESET_COLORS[0]);
      const [dailyGoalMinutes, setDailyGoalMinutes] = useState('');
      const [weeklyGoalMinutes, setWeeklyGoalMinutes] = useState('');

      const [deleteConfirmOpen, setDeleteConfirmOpen] = useState(false);
      const [subjectToDelete, setSubjectToDelete] = useState(null);

      const openAddModal = () => {
        setEditingSubject(null); setName(''); setColor(PRESET_COLORS[subjects.length % PRESET_COLORS.length]);
        setDailyGoalMinutes(''); setWeeklyGoalMinutes(''); setFormError(''); setIsModalOpen(true);
      };

      const openEditModal = (subject) => {
        setEditingSubject(subject); setName(subject.name); setColor(subject.color || PRESET_COLORS[0]);
        setDailyGoalMinutes(subject.dailyGoalMinutes ? String(subject.dailyGoalMinutes) : '');
        setWeeklyGoalMinutes(subject.weeklyGoalMinutes ? String(subject.weeklyGoalMinutes) : '');
        setFormError(''); setIsModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!name.trim()) { setFormError('Subject name is required.'); return; }
        const dailyVal = dailyGoalMinutes ? parseInt(dailyGoalMinutes, 10) : 0;
        const weeklyVal = weeklyGoalMinutes ? parseInt(weeklyGoalMinutes, 10) : 0;
        if (dailyVal < 0 || weeklyVal < 0) { setFormError('Goal minutes cannot be negative.'); return; }

        const newSubject = {
          id: editingSubject ? editingSubject.id : 'subj_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          name: name.trim(),
          color: color || PRESET_COLORS[0],
          dailyGoalMinutes: dailyVal,
          weeklyGoalMinutes: weeklyVal,
          order: editingSubject ? editingSubject.order : subjects.length
        };
        onSaveSubject(newSubject);
        setIsModalOpen(false);
        onShowToast({ type: 'success', message: editingSubject ? `Updated "${newSubject.name}"!` : `Added "${newSubject.name}"!` });
      };

      const promptDelete = (subject) => {
        setSubjectToDelete(subject);
        setDeleteConfirmOpen(true);
      };

      const confirmDelete = () => {
        if (subjectToDelete) {
          onDeleteSubject(subjectToDelete.id);
          onShowToast({ type: 'info', message: `Deleted subject "${subjectToDelete.name}".` });
        }
        setDeleteConfirmOpen(false);
        setSubjectToDelete(null);
      };

      const moveSubject = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= subjects.length) return;
        const reordered = [...subjects];
        const [moved] = reordered.splice(index, 1);
        reordered.splice(targetIndex, 0, moved);
        onReorderSubjects(reordered.map((s, idx) => ({ ...s, order: idx })));
      };

      const recordedSessionCount = subjectToDelete ? sessions.filter(s => s.subjectId === subjectToDelete.id).length : 0;

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

            </div>
            <button onClick={openAddModal} className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 active:scale-95">

            {subjects.map((subject, idx) => {
              const sessionCount = sessions.filter(s => s.subjectId === subject.id).length;

              return (
                <div key={subject.id} className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm flex flex-col justify-between">
                  <div className="flex items-start justify-between">
                    <div className="flex items-center gap-3">
                      <span className="w-4 h-4 rounded-full ring-4 ring-offset-2 dark:ring-offset-slate-900" style={{ backgroundColor: subject.color }} />
                      <div>
                        <h3 className="font-extrabold text-base text-slate-900 dark:text-white">{subject.name}</h3>
                        <div className="text-xs text-slate-400 mt-0.5">{sessionCount} sessions • {(totalSeconds / 3600).toFixed(1)}h logged</div>
                      </div>
                    </div>
                    <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                      <button onClick={() => moveSubject(idx, -1)} disabled={idx === 0} className="p-1 text-slate-400 disabled:opacity-30 text-xs">▲</button>
                      <button onClick={() => moveSubject(idx, 1)} disabled={idx === subjects.length - 1} className="p-1 text-slate-400 disabled:opacity-30 text-xs">▼</button>
                    </div>
                  </div>
                  <div className="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between text-xs text-slate-500">
                    <div>Daily: {subject.dailyGoalMinutes ? `${subject.dailyGoalMinutes}m` : 'None'} • Weekly: {subject.weeklyGoalMinutes ? `${subject.weeklyGoalMinutes}m` : 'None'}</div>
                    <div className="flex gap-2">
                      <button onClick={() => openEditModal(subject)} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold text-slate-700 dark:text-slate-200">Edit</button>
                      <button onClick={() => promptDelete(subject)} className="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-600 font-semibold">Delete</button>
                    </div>

                </div>
              );

          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl animate-scaleUp">
                <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-4">{editingSubject ? 'Edit Subject' : 'Add Subject'}</h3>
                <form onSubmit={handleSave} className="space-y-4">
                  {formError && <div className="p-3 rounded-xl bg-red-500/10 text-red-500 text-xs">{formError}</div>}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Subject Name *</label>
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Mathematics, DSA..." className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none" autoFocus />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">Color</label>

                      ))}

                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Daily Goal (min)</label>
                      <input type="number" min="0" value={dailyGoalMinutes} onChange={(e) => setDailyGoalMinutes(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Weekly Goal (min)</label>
                      <input type="number" min="0" value={weeklyGoalMinutes} onChange={(e) => setWeeklyGoalMinutes(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-sm font-bold bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-500/25">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <ConfirmationModal
            isOpen={deleteConfirmOpen}
            danger={true}
            title={`Delete "${subjectToDelete?.name}"?`}
            message={
              recordedSessionCount > 0
                ? `⚠️ This subject has ${recordedSessionCount} recorded study sessions in your history. Deleting it will keep historical records safe as unassigned, but remove the subject. Confirm deletion?`
                : `Are you sure you want to delete "${subjectToDelete?.name}"?`

            onConfirm={confirmDelete}
            onCancel={() => setDeleteConfirmOpen(false)}
          />

      );

    // --- STUDY TIMER (STOPWATCH) ---
    function StudyTimer({ subjects, activeTimerState, onSaveActiveTimer, onClearActiveTimer, onCompleteSession, onShowToast, initialSubjectId }) {
      const [selectedSubjectId, setSelectedSubjectId] = useState(activeTimerState?.subjectId || initialSubjectId || (subjects[0]?.id || ''));
      const [sessionNote, setSessionNote] = useState(activeTimerState?.note || '');
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [isRunning, setIsRunning] = useState(Boolean(activeTimerState?.isRunning));
      const [isFinishing, setIsFinishing] = useState(false);
      const isSubmittingRef = useRef(false);

      useEffect(() => {
        if (initialSubjectId && !activeTimerState) setSelectedSubjectId(initialSubjectId);
      }, [initialSubjectId, activeTimerState]);

      const computeCurrentElapsedMs = (timer) => {
        if (!timer) return 0;
        const base = timer.accumulatedMs || 0;
        if (timer.isRunning && timer.lastStartedAt) {
          return base + Math.max(0, Date.now() - timer.lastStartedAt);
        }
        return base;
      };

      useEffect(() => {
        if (activeTimerState) {
          setSelectedSubjectId(activeTimerState.subjectId || (subjects[0]?.id || ''));
          setSessionNote(activeTimerState.note || '');
          setIsRunning(Boolean(activeTimerState.isRunning));
          const totalMs = computeCurrentElapsedMs(activeTimerState);
          setElapsedSeconds(Math.floor(totalMs / 1000));
        } else {
          setElapsedSeconds(0);
          setIsRunning(false);
          setSessionNote('');
        }
      }, [activeTimerState, subjects]);

      useEffect(() => {
        if (!isRunning || !activeTimerState) return;
        const interval = setInterval(() => {
          const totalMs = computeCurrentElapsedMs(activeTimerState);
          setElapsedSeconds(Math.floor(totalMs / 1000));
        }, 200);
        return () => clearInterval(interval);
      }, [isRunning, activeTimerState]);

      const handleStart = () => {
        if (!selectedSubjectId) { onShowToast({ type: 'error', message: 'Select a subject first!' }); return; }
        const now = Date.now();
        const newTimer = {
          id: 'timer_' + now, mode: 'stopwatch', subjectId: selectedSubjectId,
          startTime: now, accumulatedMs: 0, lastStartedAt: now, isRunning: true, note: sessionNote
        };
        setIsRunning(true);
        onSaveActiveTimer(newTimer);
        sound.playStart();
        onShowToast({ type: 'success', message: 'Timer started! Focus mode engaged.' });
      };

      const handlePause = () => {
        if (!activeTimerState || !activeTimerState.isRunning) return;
        const now = Date.now();
        const addedMs = Math.max(0, now - (activeTimerState.lastStartedAt || now));
        const newAccumulated = (activeTimerState.accumulatedMs || 0) + addedMs;
        const updated = { ...activeTimerState, accumulatedMs: newAccumulated, lastStartedAt: null, isRunning: false, note: sessionNote };
        setIsRunning(false);
        onSaveActiveTimer(updated);
        sound.playPause();
        onShowToast({ type: 'info', message: 'Timer paused. Breaks do not count!' });
      };

      const handleResume = () => {
        if (!activeTimerState) return;
        const now = Date.now();
        const updated = { ...activeTimerState, lastStartedAt: now, isRunning: true, note: sessionNote };
        setIsRunning(true);
        onSaveActiveTimer(updated);
        sound.playStart();
        onShowToast({ type: 'success', message: 'Session resumed!' });
      };

      const handleFinish = () => {
        if (!activeTimerState || isSubmittingRef.current) return;
        isSubmittingRef.current = true;
        setIsFinishing(true);

        const now = Date.now();
        let totalMs = activeTimerState.accumulatedMs || 0;
        if (activeTimerState.isRunning && activeTimerState.lastStartedAt) {
          totalMs += Math.max(0, now - activeTimerState.lastStartedAt);
        }
        const totalSeconds = Math.round(totalMs / 1000);

        if (totalSeconds < 1) {
          onShowToast({ type: 'error', message: 'Session too short (< 1 sec).' });
          onClearActiveTimer();
          setIsRunning(false); setElapsedSeconds(0); setIsFinishing(false); isSubmittingRef.current = false;
          return;
        }

        const sessionStartTime = activeTimerState.startTime || (now - totalMs);
        const splitSessions = distributeSessionAcrossMidnight(
          sessionStartTime, now, totalSeconds, activeTimerState.subjectId || selectedSubjectId, sessionNote
        );

        onCompleteSession(splitSessions);
        sound.playComplete();
        onClearActiveTimer();
        setIsRunning(false); setElapsedSeconds(0); setSessionNote('');

        onShowToast({ type: 'success', message: `Finished ${formatSecondsToHMS(totalSeconds)} study session! Saved to history.` });
        setTimeout(() => { setIsFinishing(false); isSubmittingRef.current = false; }, 400);
      };

      const selectedSubject = subjects.find(s => s.id === selectedSubjectId);

      return (
        <div className="max-w-2xl mx-auto space-y-8 animate-fadeIn">
          <div className="text-center space-y-2">
            <h2 className="text-3xl font-black text-slate-900 dark:text-white">Focus Stopwatch</h2>
            <p className="text-sm text-slate-500">Precision study tracker with persistent session recovery & midnight splitting</p>
          </div>

            <div className="relative z-10 mb-8 inline-block">
              <div className="flex items-center gap-2 p-1.5 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                <span className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: selectedSubject?.color || '#3B82F6' }} />
                <select
                  value={selectedSubjectId}
                  onChange={(e) => {
                    setSelectedSubjectId(e.target.value);
                    if (activeTimerState) onSaveActiveTimer({ ...activeTimerState, subjectId: e.target.value });
                  }}
                  disabled={isRunning}
                  className="bg-transparent text-sm font-bold text-slate-800 dark:text-slate-100 focus:outline-none cursor-pointer"
                >
                  {subjects.map(s => <option key={s.id} value={s.id} className="dark:bg-slate-800 text-slate-900 dark:text-white">{s.name}</option>)}
                </select>
              </div>
            </div>

            <div className="relative z-10 my-4">
              <div className="text-6xl sm:text-7xl md:text-8xl font-black font-mono tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 drop-shadow-sm select-none">
                {formatSecondsToHMS(elapsedSeconds)}
              </div>
              <div className="flex justify-center gap-12 sm:gap-16 text-[10px] sm:text-xs uppercase font-extrabold tracking-widest text-slate-400 mt-2">
                <span>Hours</span><span>Minutes</span><span>Seconds</span>
              </div>
            </div>

            <div className="relative z-10 my-6 max-w-md mx-auto">
              <input
                type="text"
                placeholder="Session notes (e.g., Chapter 3 Calculus, Binary Search Trees)..."
                value={sessionNote}
                onChange={(e) => {
                  setSessionNote(e.target.value);
                  if (activeTimerState) onSaveActiveTimer({ ...activeTimerState, note: e.target.value });
                }}
                className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs sm:text-sm text-center focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div className="relative z-10 flex flex-wrap items-center justify-center gap-4 mt-8">
              {!activeTimerState ? (
                <button
                  onClick={handleStart}
                  disabled={subjects.length === 0}
                  className="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-extrabold text-base shadow-xl shadow-indigo-500/30 active:scale-95 disabled:opacity-50"
                >

                </button>
              ) : (
                <>

                    </button>

                  <button

            <p>• <strong>Pauses Excluded:</strong> Only real study time is calculated and stored.</p>
