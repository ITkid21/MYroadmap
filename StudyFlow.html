    // --- POMODORO TIMER ---
    function PomodoroTimer({ subjects, settings, onCompleteSession, onShowToast }) {
      const pomodoroSettings = settings?.pomodoro || { studyMinutes: 25, shortBreakMinutes: 5, longBreakMinutes: 15, longBreakInterval: 4 };
      const [mode, setMode] = useState('study');
      const [selectedSubjectId, setSelectedSubjectId] = useState(subjects[0]?.id || '');
      const [completedCycles, setCompletedCycles] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const [timeLeft, setTimeLeft] = useState(pomodoroSettings.studyMinutes * 60);
      const [note, setNote] = useState('');
      const studyStartTimestampRef = useRef(null);

      const switchMode = (newMode) => {
        setIsRunning(false); setMode(newMode);
        if (newMode === 'study') setTimeLeft(pomodoroSettings.studyMinutes * 60);
        else if (newMode === 'shortBreak') setTimeLeft(pomodoroSettings.shortBreakMinutes * 60);
        else setTimeLeft(pomodoroSettings.longBreakMinutes * 60);
      };

      useEffect(() => {
        if (!isRunning) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              handleIntervalComplete();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isRunning, mode, completedCycles]);

      const handleIntervalComplete = () => {
        setIsRunning(false);
        sound.playBell();

        if (mode === 'study') {
          const studySeconds = pomodoroSettings.studyMinutes * 60;
          const now = Date.now();
          const startTime = studyStartTimestampRef.current || (now - studySeconds * 1000);
          const sessionObj = {
            id: 'sess_pomo_' + now + '_' + Math.random().toString(36).substring(2, 6),
            subjectId: selectedSubjectId || (subjects[0]?.id || 'unassigned'),
            date: getLocalDateString(new Date(now)),
            startTime: new Date(startTime).toISOString(),
            endTime: new Date(now).toISOString(),
            durationSeconds: studySeconds,
            note: note.trim() ? `Pomodoro: ${note.trim()}` : 'Pomodoro focus session'
          };
          onCompleteSession([sessionObj]);
          const nextCycles = completedCycles + 1;
          setCompletedCycles(nextCycles);
          onShowToast({ type: 'success', message: `🍅 ${pomodoroSettings.studyMinutes}m focus session recorded! Time for a break.` });

          if (nextCycles % pomodoroSettings.longBreakInterval === 0) switchMode('longBreak');
          else switchMode('shortBreak');
        } else {
          onShowToast({ type: 'info', message: 'Break finished! Ready to study.' });
          switchMode('study');
        }
      };

      const handleStart = () => {
        if (mode === 'study') studyStartTimestampRef.current = Date.now();
        setIsRunning(true);
        sound.playStart();
      };

      const totalDuration = mode === 'study' ? pomodoroSettings.studyMinutes * 60 : mode === 'shortBreak' ? pomodoroSettings.shortBreakMinutes * 60 : pomodoroSettings.longBreakMinutes * 60;
      const progressPercent = totalDuration > 0 ? Math.round(((totalDuration - timeLeft) / totalDuration) * 100) : 0;

      return (
        <div className="max-w-xl mx-auto space-y-8 animate-fadeIn">
          <div className="text-center space-y-2">
            <h2 className="text-3xl font-black text-slate-900 dark:text-white">Pomodoro Mode</h2>
            <p className="text-sm text-slate-500">25m Focus • 5m Short Break • 15m Long Break (Breaks never count as study time)</p>
          </div>

          <div className="flex justify-center p-1.5 bg-slate-100 dark:bg-slate-800 rounded-2xl max-w-sm mx-auto">
            <button onClick={() => switchMode('study')} className={`flex-1 py-2 text-xs font-bold rounded-xl transition ${mode === 'study' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500'}`}>
              🍅 Focus ({pomodoroSettings.studyMinutes}m)
            </button>
            <button onClick={() => switchMode('shortBreak')} className={`flex-1 py-2 text-xs font-bold rounded-xl transition ${mode === 'shortBreak' ? 'bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-300 shadow-sm' : 'text-slate-500'}`}>
              ☕ Short ({pomodoroSettings.shortBreakMinutes}m)
            </button>
            <button onClick={() => switchMode('longBreak')} className={`flex-1 py-2 text-xs font-bold rounded-xl transition ${mode === 'longBreak' ? 'bg-white dark:bg-slate-700 text-purple-600 dark:text-purple-300 shadow-sm' : 'text-slate-500'}`}>
              🌴 Long ({pomodoroSettings.longBreakMinutes}m)
            </button>
          </div>

          <div className="p-8 md:p-12 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-2xl text-center space-y-6">
            {mode === 'study' ? (
              <div className="inline-block">
                <select value={selectedSubjectId} onChange={(e) => setSelectedSubjectId(e.target.value)} disabled={isRunning} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-bold text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 focus:outline-none">
                  {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
            ) : (
              <span className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                ☕ Rest & Recharge (Breaks do not count in stats)
              </span>
            )}

            <div className="text-7xl sm:text-8xl font-black font-mono tracking-tight text-slate-900 dark:text-white select-none">
              {formatSecondsToHMS(timeLeft).substring(3)}
            </div>

            <div className="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
              <div className={`h-full transition-all duration-500 ${mode === 'study' ? 'bg-indigo-600' : 'bg-emerald-500'}`} style={{ width: `${progressPercent}%` }} />
            </div>

            <div className="flex items-center justify-center gap-4 pt-4">
              {!isRunning ? (
                <button onClick={handleStart} className="px-8 py-3 rounded-2xl bg-indigo-600 text-white font-bold text-sm shadow-xl shadow-indigo-500/25 active:scale-95">
                  ▶ Start
                </button>
              ) : (
                <button onClick={() => { setIsRunning(false); sound.playPause(); }} className="px-8 py-3 rounded-2xl bg-amber-500 text-white font-bold text-sm shadow-xl shadow-amber-500/25 active:scale-95">
                  ⏸ Pause
                </button>
              )}
              <button onClick={() => switchMode(mode)} className="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold">
                Reset
              </button>
            </div>

            <div className="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-center gap-2 text-xs text-slate-400">
              <span>Completed cycles:</span>
              <span className="font-extrabold text-slate-700 dark:text-slate-200">{completedCycles}</span>
            </div>
          </div>
        </div>
      );
    }

    // --- STUDY ANALYTICS ---
    function StudyAnalytics({ subjects, sessions, goals }) {
      const [period, setPeriod] = useState('week');
      const [customStart, setCustomStart] = useState('');
      const [customEnd, setCustomEnd] = useState('');
      const [hoveredBar, setHoveredBar] = useState(null);

      const filteredSessions = useMemo(() => {
        const todayStr = getLocalDateString();
        if (period === 'week') {
          const d = new Date(); d.setDate(d.getDate() - 6);
          return sessions.filter(s => s.date >= getLocalDateString(d) && s.date <= todayStr);
        }
        if (period === 'month') {
          const d = new Date(); d.setDate(d.getDate() - 29);
          return sessions.filter(s => s.date >= getLocalDateString(d) && s.date <= todayStr);
        }
        if (period === 'custom' && customStart && customEnd) {
          return sessions.filter(s => s.date >= customStart && s.date <= customEnd);
        }
        return sessions;
      }, [sessions, period, customStart, customEnd]);

      const { totalSeconds, subjectTotals, dailyLast7Days } = useMemo(() => {
        let total = 0; const subjMap = {};
        filteredSessions.forEach(s => {
          const dur = s.durationSeconds || 0;
          total += dur;
          subjMap[s.subjectId] = (subjMap[s.subjectId] || 0) + dur;
        });

        const last7 = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const dateStr = getLocalDateString(d);
          const dayName = d.toLocaleDateString(undefined, { weekday: 'short' });
          const daySec = sessions.filter(s => s.date === dateStr).reduce((sum, s) => sum + (s.durationSeconds || 0), 0);
          last7.push({ dateStr, label: `${dayName} ${d.getDate()}`, seconds: daySec, hours: (daySec / 3600).toFixed(1) });
        }
        return { totalSeconds: total, subjectTotals: subjMap, dailyLast7Days: last7 };
      }, [filteredSessions, sessions]);

      const maxDaySeconds = Math.max(3600 * 2, ...dailyLast7Days.map(d => d.seconds));

      const subjectPercentages = useMemo(() => {
        return subjects.map(s => {
          const sec = subjectTotals[s.id] || 0;
          const pct = totalSeconds > 0 ? Math.round((sec / totalSeconds) * 100) : 0;
          return { ...s, seconds: sec, percentage: pct };
        }).sort((a, b) => b.seconds - a.seconds);
      }, [subjects, subjectTotals, totalSeconds]);

      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-black text-slate-900 dark:text-white">Study Analytics</h2>
              <p className="text-xs sm:text-sm text-slate-500">Interactive charts displaying daily velocity and subject share</p>
            </div>
            <div className="flex items-center gap-2 p-1.5 bg-slate-100 dark:bg-slate-800 rounded-2xl">
              {[
                { id: 'week', label: 'Last 7 Days' },
                { id: 'month', label: 'Last 30 Days' },
                { id: 'all', label: 'All Time' },
                { id: 'custom', label: 'Custom' }
              ].map(f => (
                <button
                  key={f.id}
                  onClick={() => setPeriod(f.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                    period === f.id ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500'
                  }`}
                >
                  {f.label}
                </button>
              ))}
            </div>
          </div>

          {period === 'custom' && (
            <div className="flex items-center gap-3 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <span className="text-xs text-slate-500 font-bold">From:</span>
              <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className="px-3 py-1.5 rounded-lg border text-xs dark:bg-slate-800" />
              <span className="text-xs text-slate-500 font-bold">To:</span>
              <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className="px-3 py-1.5 rounded-lg border text-xs dark:bg-slate-800" />
            </div>
          )}

          {/* Daily Study Velocity Bar Chart */}
          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm space-y-6">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-lg font-bold text-slate-900 dark:text-white">Daily Study Velocity</h3>
                <p className="text-xs text-slate-400">Daily study hours over the past 7 days</p>
              </div>
              <div className="text-right">
                <div className="text-xl font-black text-indigo-600 dark:text-indigo-400">
                  {formatSecondsHuman(dailyLast7Days.reduce((a, b) => a + b.seconds, 0))}
                </div>
                <div className="text-[11px] text-slate-400 font-medium">7-Day Total</div>
              </div>
            </div>

            <div className="relative pt-8 pb-2">
              {hoveredBar && (
                <div className="absolute top-0 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold shadow-xl border border-slate-700">
                  {hoveredBar.label}: {formatSecondsHuman(hoveredBar.seconds)} ({hoveredBar.hours} hrs)
                </div>
              )}

              <div className="grid grid-cols-7 gap-2 sm:gap-4 h-56 items-end border-b border-slate-100 dark:border-slate-800 pb-2">
                {dailyLast7Days.map((day, idx) => {
                  const heightPercent = maxDaySeconds > 0 ? Math.min(100, Math.round((day.seconds / maxDaySeconds) * 100)) : 0;
                  const isToday = idx === 6;
                  return (
                    <div
                      key={day.dateStr}
                      className="flex flex-col items-center justify-end h-full cursor-pointer group"
                      onMouseEnter={() => setHoveredBar(day)}
                      onMouseLeave={() => setHoveredBar(null)}
                    >
                      <span className="text-[11px] font-bold text-slate-400 group-hover:text-indigo-500 mb-1">
                        {day.seconds > 0 ? `${day.hours}h` : '0h'}
                      </span>
                      <div className="w-full max-w-[42px] bg-slate-100 dark:bg-slate-800 rounded-xl overflow-hidden h-full flex flex-col justify-end p-0.5">
                        <div
                          className={`w-full rounded-lg transition-all duration-500 ${
                            isToday ? 'bg-gradient-to-t from-blue-600 via-indigo-600 to-purple-600' : 'bg-gradient-to-t from-indigo-500/80 to-purple-500/80'
                          }`}
                          style={{ height: `${Math.max(4, heightPercent)}%` }}
                        />
                      </div>
                      <span className={`text-[11px] font-bold mt-2 ${isToday ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                        {day.label}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Subject Share Distribution */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm space-y-6">
              <h3 className="text-lg font-bold text-slate-900 dark:text-white">Subject Distribution</h3>
              <div className="h-4 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden flex">
                {subjectPercentages.map(s => s.percentage > 0 && (
                  <div key={s.id} style={{ width: `${s.percentage}%`, backgroundColor: s.color }} className="h-full" title={`${s.name}: ${s.percentage}%`} />
                ))}
              </div>
              <div className="space-y-3 pt-2">
                {subjectPercentages.map(s => (
                  <div key={s.id} className="space-y-1">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="flex items-center gap-2 text-slate-800 dark:text-slate-200">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: s.color }} />
                        {s.name}
                      </span>
                      <span>{formatSecondsHuman(s.seconds)} ({s.percentage}%)</span>
                    </div>
                    <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{ width: `${s.percentage}%`, backgroundColor: s.color }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm space-y-4">
              <h3 className="text-lg font-bold text-slate-900 dark:text-white">Goal Progress</h3>
              <div className="space-y-3">
                {subjects.map(s => {
                  const sec = subjectTotals[s.id] || 0;
                  const targetSec = (s.dailyGoalMinutes || 0) * 60;
                  return (
                    <div key={s.id} className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border flex justify-between items-center text-xs">
                      <span className="font-bold">{s.name}</span>
                      <div className="text-right">
                        <div className="font-bold">{formatSecondsHuman(sec)}</div>
                        {targetSec > 0 && <div className="text-emerald-500 font-bold">{Math.round((sec / targetSec) * 100)}% of daily target</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- STUDY HISTORY ---
    function StudyHistory({ subjects, sessions, onUpdateSession, onDeleteSession, onShowToast }) {
      const [filterSubjectId, setFilterSubjectId] = useState('all');
      const [filterDate, setFilterDate] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [editingSession, setEditingSession] = useState(null);
      const [editDurationMinutes, setEditDurationMinutes] = useState('');
      const [editNote, setEditNote] = useState('');
      const [editDate, setEditDate] = useState('');
      const [deleteConfirmOpen, setDeleteConfirmOpen] = useState(false);
      const [sessionToDelete, setSessionToDelete] = useState(null);

      const subjectMap = useMemo(() => {
        const map = {}; subjects.forEach(s => { map[s.id] = s; }); return map;
      }, [subjects]);

      const filteredSessions = useMemo(() => {
        return sessions.filter(sess => {
          if (filterSubjectId !== 'all' && sess.subjectId !== filterSubjectId) return false;
          if (filterDate && sess.date !== filterDate) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const noteMatch = (sess.note || '').toLowerCase().includes(q);
            const subjMatch = (subjectMap[sess.subjectId]?.name || '').toLowerCase().includes(q);
            if (!noteMatch && !subjMatch) return false;
          }
          return true;
        });
      }, [sessions, filterSubjectId, filterDate, searchQuery, subjectMap]);

      const handleSaveEdit = (e) => {
        e.preventDefault();
        const mins = parseInt(editDurationMinutes, 10);
        if (isNaN(mins) || mins <= 0) { onShowToast({ type: 'error', message: 'Duration must be positive.' }); return; }
        onUpdateSession({ ...editingSession, durationSeconds: mins * 60, note: editNote.trim(), date: editDate });
        setEditingSession(null);
        onShowToast({ type: 'success', message: 'Record updated! Stats recalculated.' });
      };

      const confirmDelete = () => {
        if (sessionToDelete) {
          onDeleteSession(sessionToDelete.id);
          onShowToast({ type: 'info', message: 'Session deleted. Stats recalculated.' });
        }
        setDeleteConfirmOpen(false); setSessionToDelete(null);
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-black text-slate-900 dark:text-white">Study History</h2>
              <p className="text-xs sm:text-sm text-slate-500">Filter, edit, or delete previous study records</p>
            </div>
            <button onClick={() => exportToCSV(subjects)} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
              📥 Export CSV
            </button>
          </div>

          <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap gap-3">
            <select value={filterSubjectId} onChange={(e) => setFilterSubjectId(e.target.value)} className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs font-bold">
              <option value="all">All Subjects</option>
              {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <input type="date" value={filterDate} onChange={(e) => setFilterDate(e.target.value)} className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs" />
            <input type="text" placeholder="Search notes..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs" />
          </div>

          <div className="overflow-hidden rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 dark:bg-slate-800/60 uppercase text-slate-400 font-bold">
                  <tr>
                    <th className="py-3 px-4">Date</th>
                    <th className="py-3 px-4">Subject</th>
                    <th className="py-3 px-4">Window</th>
                    <th className="py-3 px-4">Duration</th>
                    <th className="py-3 px-4">Notes</th>
                    <th className="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {filteredSessions.map(sess => {
                    const subj = subjectMap[sess.subjectId];
                    return (
                      <tr key={sess.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                        <td className="py-3 px-4 font-bold">{formatFriendlyDate(sess.date)}</td>
                        <td className="py-3 px-4">
                          <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold" style={{ backgroundColor: `${subj?.color || '#94A3B8'}20`, color: subj?.color }}>
                            {subj?.name || 'Unassigned'}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-slate-400">{sess.startTime ? formatTime12H(sess.startTime) : '--'} - {sess.endTime ? formatTime12H(sess.endTime) : '--'}</td>
                        <td className="py-3 px-4 font-mono font-bold">{formatSecondsToHMS(sess.durationSeconds || 0)}</td>
                        <td className="py-3 px-4 max-w-xs truncate">{sess.note || <span className="text-slate-400 italic">None</span>}</td>
                        <td className="py-3 px-4 text-right space-x-2">
                          <button onClick={() => { setEditingSession(sess); setEditDurationMinutes(String(Math.round((sess.durationSeconds || 0) / 60))); setEditNote(sess.note || ''); setEditDate(sess.date); }} className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 font-bold">Edit</button>
                          <button onClick={() => { setSessionToDelete(sess); setDeleteConfirmOpen(true); }} className="px-2.5 py-1 rounded-lg bg-red-500/10 text-red-500 font-bold">Delete</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {filteredSessions.length === 0 && <div className="p-12 text-center text-slate-400">No session records found.</div>}
          </div>

          {editingSession && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white dark:bg-slate-900 border rounded-3xl max-w-md w-full p-6 shadow-2xl animate-scaleUp">
                <h3 className="text-xl font-bold mb-4">Edit Session</h3>
                <form onSubmit={handleSaveEdit} className="space-y-4 text-xs">
                  <div><label className="font-bold">Date</label><input type="date" value={editDate} onChange={(e) => setEditDate(e.target.value)} className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 mt-1" /></div>
                  <div><label className="font-bold">Duration (minutes)</label><input type="number" min="1" value={editDurationMinutes} onChange={(e) => setEditDurationMinutes(e.target.value)} className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 mt-1" /></div>
                  <div><label className="font-bold">Notes</label><textarea rows="3" value={editNote} onChange={(e) => setEditNote(e.target.value)} className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 mt-1" /></div>
                  <div className="flex justify-end gap-3 pt-3 border-t"><button type="button" onClick={() => setEditingSession(null)}>Cancel</button><button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save</button></div>
                </form>
              </div>
            </div>
          )}

          <ConfirmationModal
            isOpen={deleteConfirmOpen}
            danger={true}
            title="Delete Session Record?"
            message="Delete this record? Statistics will be immediately recalculated."
            confirmText="Delete"
            cancelText="Cancel"
            onConfirm={confirmDelete}
            onCancel={() => setDeleteConfirmOpen(false)}
          />
        </div>
      );
    }

    // --- DAILY GOALS ---
    function DailyGoals({ goals, subjects, sessions, onSaveGoals, onShowToast }) {
      const currentDailyMins = goals?.overallDailyMinutes || 240;
      const [dailyHours, setDailyHours] = useState(Math.floor(currentDailyMins / 60));
      const [dailyMins, setDailyMins] = useState(currentDailyMins % 60);

      const todayStr = getLocalDateString(new Date());
      const todaySeconds = sessions.filter(s => s.date === todayStr).reduce((sum, s) => sum + (s.durationSeconds || 0), 0);
      const targetSeconds = (dailyHours * 60 + dailyMins) * 60;
      const progressPercent = targetSeconds > 0 ? Math.min(100, Math.round((todaySeconds / targetSeconds) * 100)) : 0;

      const handleSave = (e) => {
        e.preventDefault();
        const totalMinutes = (parseInt(dailyHours, 10) || 0) * 60 + (parseInt(dailyMins, 10) || 0);
        if (totalMinutes <= 0) { onShowToast({ type: 'error', message: 'Goal must be > 0 min.' }); return; }
        onSaveGoals({ ...goals, overallDailyMinutes: totalMinutes });
        onShowToast({ type: 'success', message: `Daily goal set to ${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m!` });
      };

      return (
        <div className="max-w-2xl mx-auto space-y-8 animate-fadeIn">
          <div>
            <h2 className="text-2xl font-black text-slate-900 dark:text-white">Daily Study Goals</h2>
            <p className="text-xs sm:text-sm text-slate-500">Set daily targets and build consistency</p>
          </div>

          <div className="p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-xl space-y-6">
            <div className="flex items-center justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-indigo-600">Today's Achievement</span>
                <div className="text-3xl font-black mt-1">{formatSecondsHuman(todaySeconds)}</div>
                <div className="text-xs text-slate-400">Target: {dailyHours}h {dailyMins}m</div>
              </div>
              <div className="w-20 h-20 rounded-full border-4 border-slate-100 dark:border-slate-800 flex items-center justify-center text-xl font-black text-indigo-600">
                {progressPercent}%
              </div>
            </div>
            <div className="h-4 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden p-0.5">
              <div className="h-full bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full transition-all duration-700" style={{ width: `${progressPercent}%` }} />
            </div>
          </div>

          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm space-y-4">
            <h3 className="text-lg font-bold">Customize Goal</h3>
            <form onSubmit={handleSave} className="space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold mb-1">Hours</label><input type="number" min="0" max="24" value={dailyHours} onChange={(e) => setDailyHours(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border dark:bg-slate-800" /></div>
                <div><label className="block text-xs font-bold mb-1">Minutes</label><input type="number" min="0" max="59" value={dailyMins} onChange={(e) => setDailyMins(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border dark:bg-slate-800" /></div>
              </div>
              <button type="submit" className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-500/25">Save Goal</button>
            </form>
          </div>
        </div>
      );
    }

    // --- SETTINGS MODAL ---
    function SettingsModal({ settings, subjects, onSaveSettings, onReloadAllData, onClearAllData, onShowToast }) {
      const [pomoStudy, setPomoStudy] = useState(settings?.pomodoro?.studyMinutes || 25);
      const [pomoShort, setPomoShort] = useState(settings?.pomodoro?.shortBreakMinutes || 5);
      const [pomoLong, setPomoLong] = useState(settings?.pomodoro?.longBreakMinutes || 15);
      const [soundEnabled, setSoundEnabled] = useState(settings?.soundEnabled ?? true);
      const [clearConfirmOpen, setClearConfirmOpen] = useState(false);
      const fileInputRef = useRef(null);

      const handleSave = (e) => {
        e.preventDefault();
        onSaveSettings({
          ...settings,
          soundEnabled,
          pomodoro: { studyMinutes: parseInt(pomoStudy, 10) || 25, shortBreakMinutes: parseInt(pomoShort, 10) || 5, longBreakMinutes: parseInt(pomoLong, 10) || 15, longBreakInterval: 4 }
        });
        onShowToast({ type: 'success', message: 'Settings saved!' });
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const res = validateAndImportJSON(event.target.result);
          if (res.success) { onShowToast({ type: 'success', message: res.message }); onReloadAllData(); }
          else onShowToast({ type: 'error', message: res.message });
        };
        reader.readAsText(file);
      };

      return (
        <div className="max-w-2xl mx-auto space-y-8 animate-fadeIn">
          <div>
            <h2 className="text-2xl font-black text-slate-900 dark:text-white">Settings & Data Management</h2>
            <p className="text-xs sm:text-sm text-slate-500">Configure Pomodoro, sound effects, backups, and local storage</p>
          </div>

          <div className="p-6 rounded-3xl bg-blue-50/80 dark:bg-slate-800/60 border border-blue-200/80 dark:border-slate-700 space-y-2 text-xs leading-relaxed">
            <div className="font-bold text-blue-800 dark:text-blue-300 text-sm flex items-center gap-1.5"><span>💾</span> How LocalStorage Works</div>
            <p>StudyFlow saves everything locally in your browser's <strong>localStorage</strong>. It remains intact when refreshing or restarting.</p>
            <p><strong>Note:</strong> Data is tied to this browser profile. Use <strong>Export Backup (JSON)</strong> to transfer records to another device!</p>
          </div>

          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm space-y-4">
            <h3 className="text-lg font-bold">Backup & Restore</h3>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => { exportToJSON(); onShowToast({ type: 'success', message: 'JSON backup downloaded!' }); }} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-md">
                💾 Export Backup (JSON)
              </button>
              <button onClick={() => { exportToCSV(subjects); onShowToast({ type: 'success', message: 'CSV downloaded!' }); }} className="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs">
                📊 Export History (CSV)
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-xs">
                📥 Import Backup (JSON)
              </button>
              <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".json,application/json" className="hidden" />
            </div>
          </div>

          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm space-y-4">
            <h3 className="text-lg font-bold">Timer Durations & Sound</h3>
            <form onSubmit={handleSave} className="space-y-4 text-xs">
              <div className="grid grid-cols-3 gap-3">
                <div><label className="font-bold">Focus (min)</label><input type="number" min="1" max="120" value={pomoStudy} onChange={(e) => setPomoStudy(e.target.value)} className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 mt-1" /></div>
                <div><label className="font-bold">Short Break (min)</label><input type="number" min="1" max="60" value={pomoShort} onChange={(e) => setPomoShort(e.target.value)} className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 mt-1" /></div>
                <div><label className="font-bold">Long Break (min)</label><input type="number" min="1" max="90" value={pomoLong} onChange={(e) => setPomoLong(e.target.value)} className="w-full px-3 py-2 rounded-xl border dark:bg-slate-800 mt-1" /></div>
              </div>
              <div className="flex items-center justify-between py-2 border-t">
                <div>
                  <div className="font-bold">Synthesizer Sound Effects</div>
                  <div className="text-slate-400">Play pleasant chimes on timer start, pause, and finish</div>
                </div>
                <input type="checkbox" checked={soundEnabled} onChange={(e) => setSoundEnabled(e.target.checked)} className="w-4 h-4" />
              </div>
              <button type="submit" className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">Save Preferences</button>
            </form>
          </div>

          <div className="p-6 rounded-3xl bg-red-50/50 dark:bg-red-950/20 border border-red-200/60 dark:border-red-900/40 space-y-3">
            <h3 className="font-bold text-red-600">Danger Zone</h3>
            <button onClick={() => setClearConfirmOpen(true)} className="px-4 py-2 rounded-xl bg-red-600 text-white font-bold text-xs">
              Reset All StudyFlow Data
            </button>
          </div>

          <ConfirmationModal
            isOpen={clearConfirmOpen}
            danger={true}
            title="Reset All Data?"
            message="This will permanently delete all your sessions, subjects, and settings from this browser."
            confirmText="Erase All Data"
            cancelText="Cancel"
            onConfirm={() => { onClearAllData(); setClearConfirmOpen(false); onShowToast({ type: 'info', message: 'All data cleared.' }); }}
            onCancel={() => setClearConfirmOpen(false)}
          />
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [timerMode, setTimerMode] = useState('stopwatch');
      const [quickStartSubjId, setQuickStartSubjId] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [subjects, setSubjects] = useState(() => Storage.getSubjects());
      const [sessions, setSessions] = useState(() => Storage.getSessions());
      const [goals, setGoals] = useState(() => Storage.getGoals());
      const [settings, setSettings] = useState(() => Storage.getSettings());
      const [activeTimerState, setActiveTimerState] = useState(() => Storage.getActiveTimer());
      const [darkMode, setDarkMode] = useState(() => settings.darkMode ?? true);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        const updated = { ...settings, darkMode };
        setSettings(updated);
        Storage.saveSettings(updated);
      }, [darkMode]);

      useEffect(() => {
        sound.setMuted(!settings.soundEnabled);
      }, [settings.soundEnabled]);

      const showToast = (t) => setToast(t);

      const handleSaveSubject = (subj) => {
        const exists = subjects.some(s => s.id === subj.id);
        const updated = exists ? subjects.map(s => s.id === subj.id ? subj : s) : [...subjects, subj];
        setSubjects(updated); Storage.saveSubjects(updated);
      };

      const handleDeleteSubject = (sId) => {
        const updated = subjects.filter(s => s.id !== sId);
        setSubjects(updated); Storage.saveSubjects(updated);
      };

      const handleReorderSubjects = (reordered) => {
        setSubjects(reordered); Storage.saveSubjects(reordered);
      };

      const handleCompleteSession = (newSessions) => {
        const updated = Storage.addMultipleSessions(newSessions);
        setSessions(updated);
      };

      const handleUpdateSession = (updatedSession) => {
        const updated = Storage.updateSession(updatedSession);
        setSessions(updated);
      };

      const handleDeleteSession = (sessionId) => {
        const updated = Storage.deleteSession(sessionId);
        setSessions(updated);
      };

      const handleSaveActiveTimer = (timerObj) => {
        setActiveTimerState(timerObj); Storage.saveActiveTimer(timerObj);
      };

      const handleClearActiveTimer = () => {
        setActiveTimerState(null); Storage.clearActiveTimer();
      };

      const handleSaveGoals = (newGoals) => {
        setGoals(newGoals); Storage.saveGoals(newGoals);
      };

      const handleSaveSettings = (newSettings) => {
        setSettings(newSettings); Storage.saveSettings(newSettings);
        if (newSettings.darkMode !== darkMode) setDarkMode(newSettings.darkMode);
      };

      const handleReloadAllData = () => {
        setSubjects(Storage.getSubjects()); setSessions(Storage.getSessions());
        setGoals(Storage.getGoals()); setSettings(Storage.getSettings());
        setActiveTimerState(Storage.getActiveTimer());
      };

      const handleClearAllData = () => {
        Storage.clearAll(); handleReloadAllData();
      };

      const handleQuickStartSubject = (sId) => {
        setQuickStartSubjId(sId); setTimerMode('stopwatch'); setActiveTab('timer');
      };

      const isTimerRunning = Boolean(activeTimerState?.isRunning);

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col antialiased">
          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            isTimerRunning={isTimerRunning}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
            isOpenMobile={isMobileMenuOpen}
            setIsOpenMobile={setIsMobileMenuOpen}
          />

          <div className="lg:pl-64 flex flex-col flex-1">
            <header className="sticky top-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={() => setIsMobileMenuOpen(true)} className="lg:hidden p-2 rounded-xl text-slate-600 dark:text-slate-300">
                  ☰
                </button>
                <div className="text-sm font-extrabold uppercase tracking-wider text-slate-400">
                  {activeTab === 'dashboard' && 'Dashboard Overview'}
                  {activeTab === 'subjects' && 'Subject Manager'}
                  {activeTab === 'timer' && (timerMode === 'stopwatch' ? 'Stopwatch Study Timer' : 'Pomodoro Focus Timer')}
                  {activeTab === 'analytics' && 'Study Analytics & Trends'}
                  {activeTab === 'history' && 'Completed Sessions Log'}
                  {activeTab === 'goals' && 'Daily Study Targets'}
                  {activeTab === 'settings' && 'App Settings & Backups'}
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => setActiveTab('goals')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    activeTab === 'goals' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                  }`}
                >
                  <span>🎯</span><span className="hidden sm:inline">Goals</span>
                </button>

                {isTimerRunning && (
                  <button onClick={() => setActiveTab('timer')} className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 text-xs font-bold animate-pulse">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>Active Timer</span>
                  </button>
                )}

                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm">
                  {darkMode ? '🌙' : '☀️'}
                </button>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              {activeTab === 'dashboard' && (
                <Dashboard subjects={subjects} sessions={sessions} goals={goals} onNavigateTab={setActiveTab} onQuickStartSubject={handleQuickStartSubject} />
              )}
              {activeTab === 'subjects' && (
                <SubjectManager subjects={subjects} sessions={sessions} onSaveSubject={handleSaveSubject} onDeleteSubject={handleDeleteSubject} onReorderSubjects={handleReorderSubjects} onShowToast={showToast} />
              )}
              {activeTab === 'timer' && (
                <div className="space-y-6">
                  <div className="flex justify-center">
                    <div className="p-1 bg-slate-200 dark:bg-slate-800 rounded-2xl flex gap-1">
                      <button onClick={() => setTimerMode('stopwatch')} className={`px-5 py-2 rounded-xl text-xs font-bold transition ${timerMode === 'stopwatch' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500'}`}>
                        ⏱️ Stopwatch
                      </button>
                      <button onClick={() => setTimerMode('pomodoro')} className={`px-5 py-2 rounded-xl text-xs font-bold transition ${timerMode === 'pomodoro' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm' : 'text-slate-500'}`}>
                        🍅 Pomodoro
                      </button>
                    </div>
                  </div>

                  {timerMode === 'stopwatch' ? (
                    <StudyTimer subjects={subjects} activeTimerState={activeTimerState} onSaveActiveTimer={handleSaveActiveTimer} onClearActiveTimer={handleClearActiveTimer} onCompleteSession={handleCompleteSession} onShowToast={showToast} initialSubjectId={quickStartSubjId} />
                  ) : (
                    <PomodoroTimer subjects={subjects} settings={settings} onCompleteSession={handleCompleteSession} onShowToast={showToast} />
                  )}
                </div>
              )}
              {activeTab === 'analytics' && <StudyAnalytics subjects={subjects} sessions={sessions} goals={goals} />}
              {activeTab === 'history' && <StudyHistory subjects={subjects} sessions={sessions} onUpdateSession={handleUpdateSession} onDeleteSession={handleDeleteSession} onShowToast={showToast} />}
              {activeTab === 'goals' && <DailyGoals goals={goals} subjects={subjects} sessions={sessions} onSaveGoals={handleSaveGoals} onShowToast={showToast} />}
              {activeTab === 'settings' && <SettingsModal settings={settings} subjects={subjects} onSaveSettings={handleSaveSettings} onReloadAllData={handleReloadAllData} onClearAllData={handleClearAllData} onShowToast={showToast} />}
            </main>
          </div>

          <Toast toast={toast} onClose={() => setToast(null)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
